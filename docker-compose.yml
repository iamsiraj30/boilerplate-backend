services:
  # =========================================================================
  # 1. NestJS Backend API Service
  # =========================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tprice_api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-tprice_db}?schema=public"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tprice_network

  # =========================================================================
  # 2. PostgreSQL Database Service
  # =========================================================================
  postgres:
    image: postgres:18-alpine
    container_name: tprice_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tprice_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tprice_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tprice_network

  # =========================================================================
  # 3. pgAdmin 4 Management UI Service
  # =========================================================================
  pgadmin:
    image: dpage/pgadmin4
    container_name: tprice_pgadmin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@tprice.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - tprice_network

# Named volume for persistent database storage
volumes:
  postgres_data:

# Dedicated Docker bridge network for secure inter-service communication
networks:
  tprice_network:
    driver: bridge
